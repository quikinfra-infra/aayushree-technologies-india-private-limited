<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aayushree Technologies India Private Limited</title>
<meta name="description" content="Aayushree Technologies India Private Limited. Our website is coming soon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>
  :root {
    --bg: #f3f1ec;
    --ink: #1c2321;
    --muted: #5d6763;
    --accent: #2f6f5e;
    --line: #d6d2c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a18;
      --ink: #eceae3;
      --muted: #9aa5a0;
      --accent: #7fc4ae;
      --line: #2c3532;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    padding: 2rem clamp(1.5rem, 8vw, 7rem);
  }
  main { max-width: 46rem; }
  h1 {
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .bar {
    width: 4rem;
    height: 3px;
    background: var(--accent);
    margin: 2rem 0 1.5rem;
    transform-origin: left;
    animation: grow 1.1s ease-out both;
  }
  p { font-size: 1.2rem; line-height: 1.6; color: var(--muted); max-width: 30rem; }
  a {
    display: inline-block;
    margin-top: 2rem;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 2px;
  }
  a:hover, a:focus-visible { color: var(--accent); outline: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
</style>
</head>
<body>
  <main>
    <h1>Aayushree Technologies India Private Limited</h1>
    <div class="bar"></div>
    <p>Our website is coming soon. Thank you for visiting.</p>
    <!-- Change this to your real email address -->
    <a href="mailto:hello@example.com">Get in touch</a>
  </main>
</body>
</html>
